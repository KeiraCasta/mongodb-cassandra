<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planta Industrial - Telemetría IoT (Cassandra)</title>
    <link rel="stylesheet" href="http://40.233.7.61:3002/style.css">
    <style>
        .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .kpi-card { background: var(--primary); color: white; padding: 18px; border-radius: 8px; text-align: center; }
        .kpi-card h3 { color: var(--secondary); font-size: 0.95rem; margin-bottom: 5px; border: none; }
        .kpi-card p { font-size: 1.5rem; font-weight: bold; }
        .filter-section { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>🏭 Dashboard IoT & Estadísticas - Cassandra</h1>
        </div>
    </header>

    <div class="container">
        <div id="mensaje" class="alerta" style="display:none;"></div>

        <!-- KPIs Globales -->
        <div class="kpi-container">
            <div class="kpi-card"><h3>Total Lecturas</h3><p id="kpiTotal">0</p></div>
            <div class="kpi-card"><h3>Temp. Promedio</h3><p id="kpiTempAvg">0 °C</p></div>
            <div class="kpi-card"><h3>Humedad Promedio</h3><p id="kpiHumAvg">0 %</p></div>
            <div class="kpi-card"><h3>Temp. Máxima</h3><p id="kpiTempMax">0 °C</p></div>
            <div class="kpi-card"><h3>Temp. Mínima</h3><p id="kpiTempMin">0 °C</p></div>
        </div>

        <section class="card">
            <h2>Simular / Registrar Lectura de Sensor</h2>
            <form id="formSensor">
                <div class="form-grid">
                    <div class="form-group"><label>Sensor UUID (opcional):</label><input type="text" id="sensor_id" placeholder="Auto-generado si se vacía"></div>
                    <div class="form-group"><label>Ubicación:</label><input type="text" id="ubicacion" required placeholder="Zona Norte / Caldera"></div>
                    <div class="form-group"><label>Temperatura (°C):</label><input type="number" step="0.1" id="temperatura" required placeholder="25.5"></div>
                    <div class="form-group"><label>Humedad (%):</label><input type="number" step="0.1" id="humedad" required placeholder="60.2"></div>
                </div>
                <button type="submit" class="btn">Registrar Telemetría</button>
            </form>
        </section>

        <section class="card">
            <div class="filter-section">
                <h2 style="margin: 0; flex-grow: 1;">Historial Reciente de Sensores</h2>
                <!-- Control desplegable para filtrar por sensor -->
                <div style="display: flex; align-items: center; gap: 10px;">
                    <label for="filtroSensor" style="font-weight: bold; font-size: 0.9rem;">Filtrar por Sensor:</label>
                    <select id="filtroSensor" onchange="cargarDatosIoT()" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                        <option value="">-- Todos los sensores --</option>
                    </select>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr><th>Sensor ID</th><th>Fecha / Hora</th><th>Ubicación</th><th>Temperatura</th><th>Humedad</th></tr>
                    </thead>
                    <tbody id="tablaTelemetria"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        async function cargarDatosIoT() {
            try {
                // 1. Cargar estadísticas globales
                const resStats = await fetch('/api/estadisticas');
                const stats = await resStats.json();
                document.getElementById('kpiTotal').innerText = stats.total;
                document.getElementById('kpiTempAvg').innerText = stats.tempAvg + ' °C';
                document.getElementById('kpiHumAvg').innerText = stats.humAvg + ' %';
                document.getElementById('kpiTempMax').innerText = stats.tempMax + ' °C';
                document.getElementById('kpiTempMin').innerText = stats.tempMin + ' °C';

                // 2. Obtener el sensor seleccionado en el desplegable
                const sensorSeleccionado = document.getElementById('filtroSensor').value;
                
                // Si hay un sensor seleccionado, consultamos su endpoint específico; si no, traemos el general
                const urlTabla = sensorSeleccionado ? `/api/telemetria/${sensorSeleccionado}` : '/api/telemetria';
                
                const resTable = await fetch(urlTabla);
                const lecturas = await resTable.json();

                // Si estamos mostrando todos los sensores, actualizamos las opciones del menú desplegable
                if (!sensorSeleccionado) {
                    actualizarOpcionesSelect(lecturas);
                }

                const tbody = document.getElementById('tablaTelemetria');
                tbody.innerHTML = '';
                
                if (lecturas.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center;">No hay registros de telemetría</td></tr>`;
                    return;
                }

                lecturas.forEach(item => {
                    const alertaStyle = item.temperatura > 40 ? 'color: red; font-weight: bold;' : '';
                    tbody.innerHTML += `
                        <tr style="${alertaStyle}">
                            <td><code>${item.sensor_id}</code></td>
                            <td>${new Date(item.fecha).toLocaleString()}</td>
                            <td>${item.ubicacion}</td>
                            <td>${item.temperatura} °C</td>
                            <td>${item.humedad} %</td>
                        </tr>`;
                });
            } catch (e) { 
                mostrarAlerta('Error al sincronizar telemetría', 'error'); 
            }
        }

        // Función auxiliar para llenar el select dinámicamente con los sensores existentes
        function actualizarOpcionesSelect(lecturas) {
            const select = document.getElementById('filtroSensor');
            const valorActual = select.value;
            
            // Extraer IDs únicos de la lista de lecturas
            const idsUnicos = [...new Set(lecturas.map(item => item.sensor_id))];
            
            let opcionesHTML = '<option value="">-- Todos los sensores --</option>';
            idsUnicos.forEach(id => {
                if (id) {
                    opcionesHTML += `<option value="${id}" ${id === valorActual ? 'selected' : ''}>${id}</option>`;
                }
            });
            select.innerHTML = opcionesHTML;
        }

        document.getElementById('formSensor').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                sensor_id: document.getElementById('sensor_id').value.trim() || undefined,
                ubicacion: document.getElementById('ubicacion').value,
                temperatura: parseFloat(document.getElementById('temperatura').value),
                humedad: parseFloat(document.getElementById('humedad').value)
            };
            const res = await fetch('/api/telemetria', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if(res.ok) {
                mostrarAlerta('Lectura registrada', 'exito');
                document.getElementById('formSensor').reset();
                // Limpiar filtro al registrar para ver el nuevo dato de inmediato en la lista general
                document.getElementById('filtroSensor').value = '';
                cargarDatosIoT();
            }
        });

        function mostrarAlerta(txt, tipo) {
            const m = document.getElementById('mensaje');
            m.innerText = txt; m.className = `alerta ${tipo}`; m.style.display = 'block';
            setTimeout(() => m.style.display = 'none', 3000);
        }

        cargarDatosIoT();
    </script>
</body>
</html>
